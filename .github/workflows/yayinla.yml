name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Görsel sıkıştırma aracını kur
        run: npm install --no-audit --no-fund --no-save sharp@0.33.5 || echo "sharp kurulamadı, görseller sıkıştırılmadan yayınlanır"

      - name: Yeni içerikleri çevir (TR → EN, RU, DE, ES, AR)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/translate.mjs

      - name: Çevirileri kaydet
        run: |
          if [ -n "$(git status --porcelain content/translations)" ]; then
            git config user.name "ata.co yayın"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/translations
            git commit -m "Çeviriler güncellendi"
            git push
          fi

      - name: Siteyi oluştur
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
